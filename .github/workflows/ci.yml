name: CI

on:
  pull_request:
    branches: [ development, main ]

env:
  DEBUG_MODE: true # Set to true for detailed debugging output

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Setup viktor-cli
      run: |
        curl -Lo viktor-cli 'https://developers.viktor.ai/api/v1/get-cli/?platform=linux&format=binary'
        chmod +x viktor-cli
        ./viktor-cli ci-install
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
    
    - name: Run Ruff Style Check
      id: ruff-check
      continue-on-error: true
      run: |
        if [ "${{ env.DEBUG_MODE }}" = "true" ]; then
          python -m ruff check --config=.ruff.toml --fix
        else
          python scripts/run_ruff_check.py
        fi
        
    - name: Run Ruff Formatter  
      id: ruff-format
      continue-on-error: true
      run: |
        if [ "${{ env.DEBUG_MODE }}" = "true" ]; then
          python -m ruff format --config=.ruff.toml
        else
          python scripts/run_ruff_format.py
        fi
        
    - name: Run MyPy Type Check
      id: mypy-check
      continue-on-error: true
      run: |
        if [ "${{ env.DEBUG_MODE }}" = "true" ]; then
          python -m mypy .
        else
          python scripts/run_mypy.py
        fi
        
    - name: Run Unit Tests
      id: unit-tests
      continue-on-error: true
      run: |
        if [ "${{ env.DEBUG_MODE }}" = "true" ]; then
          python -m pytest tests/
        else
          python scripts/run_enhanced_tests.py
        fi
        
    - name: Install VIKTOR App
      id: viktor-install
      continue-on-error: true
      env:
        VIKTOR_TOKEN: ${{ secrets.VIKTOR_TOKEN }}
        VIKTOR_ENV: ${{ secrets.VIKTOR_ENV }}
        VIKTOR_DEV: ${{ secrets.VIKTOR_DEV }}
      run: |
        export PATH=$PWD:$PATH
        ./viktor-cli install
        
    - name: Run VIKTOR Tests
      id: viktor-tests
      continue-on-error: true
      env:
        VIKTOR_TOKEN: ${{ secrets.VIKTOR_TOKEN }}
        VIKTOR_ENV: ${{ secrets.VIKTOR_ENV }}
        VIKTOR_DEV: ${{ secrets.VIKTOR_DEV }}
      run: |
        export PATH=$PWD:$PATH
        python scripts/run_viktor_tests.py

    - name: Quality Check Summary
      if: always()
      run: |
        # Track overall result
        FAILED_CHECKS=0
        
        # Check each step result  
        if [ "${{ steps.ruff-check.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        if [ "${{ steps.ruff-format.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        if [ "${{ steps.mypy-check.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        if [ "${{ steps.unit-tests.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        if [ "${{ steps.viktor-install.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        if [ "${{ steps.viktor-tests.outcome }}" != "success" ]; then
          FAILED_CHECKS=$((FAILED_CHECKS + 1))
        fi
        
        # Skip detailed summary if in debug mode
        if [ "${{ env.DEBUG_MODE }}" = "true" ]; then
          echo "Running in DEBUG mode - check detailed tool output above"
          if [ $FAILED_CHECKS -gt 0 ]; then
            exit 1
          fi
          exit 0
        fi
        
        # Define colors
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        BLUE='\033[0;34m'
        YELLOW='\033[0;33m'
        NC='\033[0m' # No Color
        
        # Output clean summary
        cat << 'EOF'
        ==================================
        QUALITY CHECK SUMMARY
        ==================================
        
        EOF
        
        # Show results for each check
        if [ "${{ steps.ruff-check.outcome }}" != "success" ]; then
          echo -e "${RED}✗ Ruff Style Check: FAILED${NC}"
          echo -e "   ${YELLOW}→ Run: python scripts/run_ruff_check.py${NC}"
        else
          echo -e "${GREEN}✓ Ruff Style Check: PASSED${NC}"
        fi
        
        if [ "${{ steps.ruff-format.outcome }}" != "success" ]; then
          echo -e "${RED}✗ Ruff Formatter: FAILED${NC}" 
          echo -e "   ${YELLOW}→ Run: python scripts/run_ruff_format.py${NC}"
        else
          echo -e "${GREEN}✓ Ruff Formatter: PASSED${NC}"
        fi
        
        if [ "${{ steps.mypy-check.outcome }}" != "success" ]; then
          echo -e "${RED}✗ MyPy Type Check: FAILED${NC}"
          echo -e "   ${YELLOW}→ Run: python scripts/run_mypy.py${NC}"
        else
          echo -e "${GREEN}✓ MyPy Type Check: PASSED${NC}"
        fi
        
        if [ "${{ steps.unit-tests.outcome }}" != "success" ]; then
          echo -e "${RED}✗ Unit Tests: FAILED${NC}"
          echo -e "   ${YELLOW}→ Run: python scripts/run_enhanced_tests.py${NC}"
        else
          echo -e "${GREEN}✓ Unit Tests: PASSED${NC}"
        fi
        
        if [ "${{ steps.viktor-install.outcome }}" != "success" ]; then
          echo -e "${RED}✗ VIKTOR App Install: FAILED${NC}"
          echo -e "   ${YELLOW}→ Check VIKTOR configuration and secrets${NC}"
        else
          echo -e "${GREEN}✓ VIKTOR App Install: PASSED${NC}"
        fi
        
        if [ "${{ steps.viktor-tests.outcome }}" != "success" ]; then
          echo -e "${RED}✗ VIKTOR Tests: FAILED${NC}"
          echo -e "   ${YELLOW}→ Run: python scripts/run_viktor_tests.py${NC}"
        else
          echo -e "${GREEN}✓ VIKTOR Tests: PASSED${NC}"
        fi
        
        echo ""
        echo "=================================="
        if [ $FAILED_CHECKS -eq 0 ]; then
          echo -e "${GREEN}ALL CHECKS PASSED!${NC}"
          echo -e "${BLUE}Code is ready for merge.${NC}"
        else
          echo -e "${RED}$FAILED_CHECKS CHECK(S) FAILED${NC}"
          echo ""
          echo -e "${YELLOW}Fix the issues above, then run:${NC}"
          echo -e "${BLUE}  python ruft.py${NC}"
          echo ""
          echo -e "${YELLOW}This will automatically fix what can be fixed${NC}"
          echo -e "${YELLOW}and show you what requires manual attention.${NC}"
        fi
        echo "=================================="
        
        # Fail the job if any checks failed
        if [ $FAILED_CHECKS -gt 0 ]; then
          exit 1
        fi
